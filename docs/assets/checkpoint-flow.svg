<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>windvane: one compaction cycle, from the brief to the next brief</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f8577"/>
    </marker>
  </defs>

  <!-- the context window as a bar -->
  <text x="40" y="150" fill="#7d8590" font-size="12">context fill</text>
  <rect x="130" y="138" width="700" height="18" rx="4" fill="#7d8590" fill-opacity="0.12" stroke="#7d8590"/>
  <!-- the filled part, up to the band -->
  <rect x="130" y="138" width="560" height="18" rx="4" fill="#406b61" fill-opacity="0.35"/>
  <!-- the last call, up to the trigger -->
  <rect x="690" y="138" width="60" height="18" fill="#406b61" fill-opacity="0.7"/>
  <!-- the room between the trigger and the point -->
  <rect x="750" y="138" width="80" height="18" rx="4" fill="#7d8590" fill-opacity="0.08"/>

  <!-- markers under the bar -->
  <line x1="130" y1="156" x2="130" y2="176" stroke="#7d8590"/>
  <text x="130" y="192" fill="#7d8590" font-size="11" text-anchor="middle">session start</text>

  <!-- the optional early_compaction row: the first note comes here -->
  <line x1="400" y1="138" x2="400" y2="176" stroke="#4f8577" stroke-dasharray="3 3"/>
  <text x="400" y="192" fill="#4f8577" font-size="11" text-anchor="middle">early_compaction (optional)</text>
  <text x="400" y="206" fill="#7d8590" font-size="11" text-anchor="middle">a fill or a turn's cost: the first note</text>

  <line x1="560" y1="156" x2="560" y2="176" stroke="#7d8590"/>
  <text x="560" y="192" fill="#7d8590" font-size="11" text-anchor="middle">heads-up</text>
  <text x="560" y="220" fill="#7d8590" font-size="11" text-anchor="middle">about 87% of the point: the second note</text>

  <line x1="690" y1="156" x2="690" y2="176" stroke="#4f8577"/>
  <text x="690" y="192" fill="#4f8577" font-size="11" text-anchor="middle" font-weight="600">last call</text>
  <text x="690" y="206" fill="#7d8590" font-size="11" text-anchor="middle">about 93% of the point: the last note</text>

  <line x1="750" y1="156" x2="750" y2="176" stroke="#7d8590"/>
  <text x="750" y="222" fill="#7d8590" font-size="11" text-anchor="middle">trigger: Claude Code's own</text>
  <text x="750" y="236" fill="#7d8590" font-size="11" text-anchor="middle">compaction, 32,000 under the point</text>

  <line x1="830" y1="156" x2="830" y2="176" stroke="#7d8590"/>
  <text x="830" y="192" fill="#7d8590" font-size="11" text-anchor="middle">the point</text>
  <text x="836" y="206" fill="#7d8590" font-size="11" text-anchor="middle">(configured window)</text>

  <!-- what happens above the bar -->
  <rect x="130" y="20" width="150" height="56" rx="6" fill="#406b61" fill-opacity="0.12" stroke="#4f8577"/>
  <text x="140" y="40" fill="#4f8577" font-weight="600" font-size="12">the brief</text>
  <text x="140" y="56" fill="#7d8590" font-size="11">rules and the checkpoint,</text>
  <text x="140" y="70" fill="#7d8590" font-size="11">placed after the summary</text>
  <line x1="150" y1="76" x2="150" y2="136" stroke="#4f8577" stroke-dasharray="3 3"/>

  <rect x="300" y="20" width="230" height="56" rx="6" fill="#7d8590" fill-opacity="0.08" stroke="#7d8590"/>
  <text x="310" y="40" fill="#7d8590" font-weight="600" font-size="12">the hooks record the work</text>
  <text x="310" y="56" fill="#7d8590" font-size="11">edits, task list, commits, tests, decisions;</text>
  <text x="310" y="70" fill="#7d8590" font-size="11">the recorder keeps the draft current</text>
  <path d="M 415 76 L 415 136" fill="none" stroke="#7d8590" stroke-dasharray="3 3"/>

  <rect x="580" y="20" width="250" height="56" rx="6" fill="#406b61" fill-opacity="0.12" stroke="#4f8577"/>
  <text x="590" y="40" fill="#4f8577" font-weight="600" font-size="12">the model's own call, at a step end</text>
  <text x="590" y="56" fill="#7d8590" font-size="11">checkpoint(save) banks the draft, then</text>
  <text x="590" y="70" fill="#7d8590" font-size="11">compact_now asks for the compaction</text>
  <line x1="720" y1="76" x2="720" y2="136" stroke="#4f8577" stroke-dasharray="3 3"/>

  <!-- the compaction and the loop back -->
  <rect x="580" y="252" width="250" height="60" rx="6" fill="#406b61" fill-opacity="0.12" stroke="#4f8577"/>
  <text x="590" y="272" fill="#4f8577" font-weight="600" font-size="12">next turn boundary: compaction</text>
  <text x="590" y="288" fill="#7d8590" font-size="11">the summary, then the brief after it, then one</text>
  <text x="590" y="302" fill="#7d8590" font-size="11">prompt of windvane's resumes from the checkpoint</text>

  <path d="M 580 282 L 300 282 L 300 250 L 130 250 L 130 158" fill="none" stroke="#4f8577" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <text x="310" y="276" fill="#7d8590" font-size="11">a new cycle, with nothing lost</text>

  <!-- the floor -->
  <text x="40" y="320" fill="#7d8590" font-size="11">If compact_now is never called, Claude Code compacts at its trigger and the before-compaction hook banks the draft as the floor.</text>
</svg>
